<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="attackRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="60%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="attackBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="swordBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="swordGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glow -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#ef4444" stroke-width="4" opacity="0.35" filter="url(#glowRed)" />

  <!-- Outer Metallic Ring -->
  <circle cx="50" cy="50" r="44" fill="#1c0707" stroke="url(#attackBorder)" stroke-width="4" />

  <!-- Inner Ruby Disc -->
  <circle cx="50" cy="50" r="37" fill="url(#attackRuby)" stroke="#f87171" stroke-width="1.5" />

  <!-- Inner Embossed Ring -->
  <circle cx="50" cy="50" r="33" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.25" stroke-dasharray="3,2" />

  <!-- Crossed Swords (Embossed) -->
  <g id="swordsGroup" filter="url(#glowRed)">
    <!-- Sword 1 (Top-Left to Bottom-Right) -->
    <g transform="rotate(45 50 50)">
      <!-- Blade -->
      <polygon points="48,18 52,18 53,62 47,62" fill="url(#swordBlade)" />
      <polygon points="50,14 48,18 52,18" fill="#ffffff" />
      <!-- Center Ridge -->
      <line x1="50" y1="14" x2="50" y2="62" stroke="#64748b" stroke-width="0.8" />
      <!-- Crossguard -->
      <rect x="42" y="62" width="16" height="4" rx="2" fill="url(#swordGold)" stroke="#854d0e" stroke-width="0.5" />
      <!-- Grip -->
      <rect x="48" y="66" width="4" height="12" rx="1" fill="#450a0a" stroke="#ca8a04" stroke-width="0.5" />
      <!-- Pommel -->
      <circle cx="50" cy="80" r="3.5" fill="url(#swordGold)" />
    </g>

    <!-- Sword 2 (Top-Right to Bottom-Left) -->
    <g transform="rotate(-45 50 50)">
      <!-- Blade -->
      <polygon points="48,18 52,18 53,62 47,62" fill="url(#swordBlade)" />
      <polygon points="50,14 48,18 52,18" fill="#ffffff" />
      <!-- Center Ridge -->
      <line x1="50" y1="14" x2="50" y2="62" stroke="#64748b" stroke-width="0.8" />
      <!-- Crossguard -->
      <rect x="42" y="62" width="16" height="4" rx="2" fill="url(#swordGold)" stroke="#854d0e" stroke-width="0.5" />
      <!-- Grip -->
      <rect x="48" y="66" width="4" height="12" rx="1" fill="#450a0a" stroke="#ca8a04" stroke-width="0.5" />
      <!-- Pommel -->
      <circle cx="50" cy="80" r="3.5" fill="url(#swordGold)" />
    </g>
  </g>
</svg>
