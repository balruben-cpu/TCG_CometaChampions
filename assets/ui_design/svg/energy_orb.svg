<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="orbCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#7dd3fc" />
      <stop offset="65%" stop-color="#0284c7" />
      <stop offset="90%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <radialGradient id="electricRing" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="transparent" />
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <filter id="energyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Atmospheric Aura -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#0ea5e9" stroke-width="4" opacity="0.4" filter="url(#energyGlow)" />
  <circle cx="50" cy="50" r="44" fill="url(#electricRing)" filter="url(#energyGlow)" />

  <!-- Plasma Core -->
  <circle cx="50" cy="50" r="38" fill="url(#orbCore)" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Lightning Arcs in Background -->
  <path d="M26,38 Q38,28 52,36 T74,28" fill="none" stroke="#bae6fd" stroke-width="1.2" opacity="0.7" filter="url(#energyGlow)" />
  <path d="M24,62 Q40,70 54,60 T76,64" fill="none" stroke="#bae6fd" stroke-width="1.2" opacity="0.7" filter="url(#energyGlow)" />

  <!-- Central Bold Lightning Bolt ⚡ -->
  <polygon points="53,16 35,48 48,48 43,84 65,44 51,44" 
           fill="#ffffff" 
           stroke="#38bdf8" 
           stroke-width="2.5" 
           stroke-linejoin="round"
           filter="url(#energyGlow)" />
  
  <!-- Core Flare -->
  <circle cx="50" cy="46" r="6" fill="#ffffff" filter="url(#energyGlow)" opacity="0.9" />
</svg>
