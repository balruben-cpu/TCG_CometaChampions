<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="shieldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shieldBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glowSilver" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glow -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#94a3b8" stroke-width="4" opacity="0.3" filter="url(#glowSilver)" />

  <!-- Outer Metallic Ring -->
  <circle cx="50" cy="50" r="44" fill="url(#shieldBase)" stroke="url(#shieldRim)" stroke-width="4" />

  <!-- Inner Disc -->
  <circle cx="50" cy="50" r="37" fill="#1e293b" stroke="#475569" stroke-width="1.5" />

  <!-- Heraldic Shield -->
  <path d="M50,22 C64,22 74,25 74,38 C74,56 50,78 50,78 C50,78 26,56 26,38 C26,25 36,22 50,22 Z" 
        fill="url(#shieldPlate)" 
        stroke="url(#shieldRim)" 
        stroke-width="3" 
        filter="url(#glowSilver)" />

  <!-- Shield Inner Bevel Line -->
  <path d="M50,25 C61,25 70,28 70,39 C70,53 50,73 50,73 C50,73 30,53 30,39 C30,28 39,25 50,25 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="1" 
        opacity="0.6" />

  <!-- Center Split Divider -->
  <path d="M50,23 L50,76" stroke="#475569" stroke-width="1.5" opacity="0.7" />
  
  <!-- Right half subtle shade -->
  <path d="M50,23 C64,23 74,26 74,38 C74,56 50,77 50,77 Z" fill="#000000" opacity="0.12" />
</svg>
