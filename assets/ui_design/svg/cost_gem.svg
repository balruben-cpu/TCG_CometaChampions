<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="diamondBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="diamondFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="diamondGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glow -->
  <polygon points="50,4 96,50 50,96 4,50" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.4" filter="url(#glowBlue)" />

  <!-- Outer Gold/Obsidian Rim -->
  <polygon points="50,6 94,50 50,94 6,50" fill="#0b1329" stroke="url(#diamondGoldRim)" stroke-width="4" stroke-linejoin="round" />

  <!-- Inner Diamond Body -->
  <polygon points="50,14 86,50 50,86 14,50" fill="url(#diamondBg)" stroke="#7dd3fc" stroke-width="2" />

  <!-- Facets -->
  <polygon points="50,14 50,50 86,50" fill="url(#diamondFacet)" />
  <polygon points="50,14 14,50 50,50" fill="#38bdf8" opacity="0.3" />
  <polygon points="50,86 50,50 86,50" fill="#0284c7" opacity="0.4" />
  <polygon points="50,86 14,50 50,50" fill="#075985" opacity="0.6" />

  <!-- Center Sparkle -->
  <polygon points="50,38 53,50 65,50 55,54 58,66 50,58 42,66 45,54 35,50 47,50" fill="#ffffff" opacity="0.9" filter="url(#glowBlue)" />
  <circle cx="50" cy="50" r="3" fill="#ffffff" />
</svg>
