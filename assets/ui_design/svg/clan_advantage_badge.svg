<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="flameGreen" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Energy Aura -->
  <path d="M50,4 C55,20 70,24 74,38 C78,54 70,72 50,96 C30,72 22,54 26,38 C30,24 45,20 50,4 Z" 
        fill="url(#flameGreen)" 
        opacity="0.35" 
        filter="url(#glowGreen)" />

  <!-- Flame Badge Body -->
  <path d="M50,10 C54,23 68,27 70,40 C74,54 66,70 50,90 C34,70 26,54 30,40 C32,27 46,23 50,10 Z" 
        fill="#064e3b" 
        stroke="url(#flameGreen)" 
        stroke-width="3" />

  <!-- Inner Flame Core -->
  <path d="M50,22 C53,30 62,34 64,43 C66,53 60,65 50,78 C40,65 34,53 36,43 C38,34 47,30 50,22 Z" 
        fill="url(#flameGreen)" 
        opacity="0.25" />

  <!-- Number "+1" -->
  <text x="50" y="52" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="26" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle" 
        filter="url(#glowGreen)">+1</text>

  <!-- Text "DAÑO" -->
  <text x="50" y="68" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="11" 
        font-weight="800" 
        letter-spacing="1" 
        fill="#a7f3d0" 
        text-anchor="middle">DAÑO</text>
</svg>
