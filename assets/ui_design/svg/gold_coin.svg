<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="80%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glow -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#facc15" stroke-width="3" opacity="0.4" filter="url(#glowGold)" />

  <!-- Outer Coin Rim -->
  <circle cx="50" cy="50" r="44" fill="url(#goldGradient)" stroke="url(#goldRim)" stroke-width="3.5" />

  <!-- Inner Recessed Disc -->
  <circle cx="50" cy="50" r="37" fill="#a16207" stroke="#ca8a04" stroke-width="2" />
  <circle cx="50" cy="50" r="35" fill="url(#goldGradient)" />

  <!-- Cometa Shooting Star Stamp (Embossed) -->
  <g filter="url(#glowGold)">
    <!-- Star Body -->
    <polygon points="42,32 45,41 54,42 47,48 49,57 42,51 34,56 36,47 29,42 38,41" 
             fill="#ffffff" 
             stroke="#ca8a04" 
             stroke-width="1.5" />
    
    <!-- Comet Tail 1 -->
    <path d="M48,39 C58,35 68,34 76,33 C68,38 60,42 51,44 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8" />
    <!-- Comet Tail 2 -->
    <path d="M49,46 C60,45 70,47 77,50 C68,52 58,52 50,50 Z" fill="#fde047" stroke="#ca8a04" stroke-width="0.8" />
    <!-- Comet Tail 3 -->
    <path d="M46,53 C56,56 65,61 72,67 C63,65 54,62 45,57 Z" fill="#eab308" stroke="#ca8a04" stroke-width="0.8" />
  </g>
</svg>
